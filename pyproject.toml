[project]
name = "deep-research-agent"
version = "0.1.0"
description = "LangGraph agent that researches a topic by planning subqueries, searching the web, and synthesizing a structured report. With human-in-the-loop course-correction and Langfuse traces."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Muhriddin", email = "wg.super.statist@gmail.com" }]

dependencies = [
    # LangChain ecosystem (1.0 LTS)
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",  # SqliteSaver lives here in v1+
    "langsmith>=0.3.0",

    # Model providers — choose at runtime via init_chat_model().
    # OpenAI is the default; the others are listed because init_chat_model
    # can switch by env var without code changes.
    "langchain-openai>=0.2,<1.0",
    "langchain-anthropic>=0.2,<1.0",

    # Web search — DuckDuckGo works without an API key, so cloners can
    # demo the agent immediately. Tavily can be wired later if the user
    # wants higher-quality results.
    "ddgs>=9.0,<10.0",

    # Content fetching — readability for clean main-text extraction.
    "httpx>=0.27,<0.29",
    "readability-lxml>=0.8,<1.0",
    "lxml-html-clean>=0.4,<1.0",
    "beautifulsoup4>=4.12,<5.0",

    # FastAPI wrapper
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sse-starlette>=2.1,<3.0",

    # Observability — Langfuse v3 uses OpenTelemetry under the hood.
    "langfuse>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "respx>=0.21,<0.22",  # mock httpx in tests
    "pre-commit>=3.8,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF",
    "ASYNC", "G", "T20", "S",
]
ignore = [
    "E501",   # formatter handles line length
    "S101",   # asserts in tests are fine
    "B008",   # FastAPI Depends() in defaults — pattern, not a bug
    "S105",   # secret-detection has too many false positives on test fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false  # @tool decorators

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that hit a real LLM API",
    "unit: pure unit tests",
]
